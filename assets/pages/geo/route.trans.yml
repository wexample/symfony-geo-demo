en:
  page_title: Route
  page_description: "A road route joining several places in order, computed by an OSRM routing server and drawn on an open-source map."
  page_icon: ph:bold/path
  intro: >-
    The road joining three places, in order, asked of an OSRM server. The
    public one serves demos only: an app in production points
    wexample_symfony_geo_ds.routing.url at its own.

fr:
  page_title: Itinéraire
  page_description: "Un itinéraire routier reliant plusieurs lieux dans l'ordre, calculé par un serveur de routage OSRM et tracé sur une carte open source."
  page_icon: 'ph:bold/path'
  intro: "La route reliant trois lieux, dans l'ordre, demandée à un serveur OSRM. Le public sert uniquement aux démonstrations : une application en production pointe wexample_symfony_geo_ds.routing.url vers la sienne."

zh:
  page_title: 路线
  page_description: "按顺序连接多个地点的道路路线，由 OSRM 路径规划服务器计算，并绘制在开源地图上。"
  page_icon: 'ph:bold/path'
  intro: '连接三个地点的道路，按照顺序，由 OSRM 服务器请求。公共服务器仅用于演示：生产中的应用程序将 wexample_symfony_geo_ds.routing.url 指向自己的服务器。'

ar:
  page_title: المسار
  page_description: "مسار طرقي يربط عدة أماكن بالترتيب، يحسبه خادم توجيه OSRM ويُرسم على خريطة مفتوحة المصدر."
  page_icon: 'ph:bold/path'
  intro: 'الطريق الذي يربط بين ثلاثة أماكن، بالترتيب، طلب من خادم OSRM. الخادم العام يخدم العروض فقط: تطبيق في الإنتاج يشير إلى wexample_symfony_geo_ds.routing.url الخاص به.'

hi:
  page_title: मार्ग
  page_description: "कई स्थानों को क्रम से जोड़ता सड़क मार्ग, OSRM रूटिंग सर्वर द्वारा गणना किया गया और ओपन-सोर्स मानचित्र पर बनाया गया।"
  page_icon: 'ph:bold/path'
  intro: 'तीन स्थानों को, क्रम में, जोड़ने वाला रास्ता, OSRM सर्वर से पूछा गया। सार्वजनिक वाला केवल डेमो प्रदान करता है: उत्पादन में एक ऐप अपने स्वयं के wexample_symfony_geo_ds.routing.url पर इंगित करता है।'

he:
  page_title: נתיב
  page_description: "מסלול נסיעה המחבר כמה מקומות לפי הסדר, מחושב על ידי שרת ניתוב OSRM ומצויר על מפה בקוד פתוח."
  page_icon: 'ph:bold/path'
  intro: 'הדרך המחברת בין שלושה מקומות, בסדר, שנשאלה משרת OSRM. הציבורי משמש רק להצגות: אפליקציה בייצור מצביעה wexample_symfony_geo_ds.routing.url על שלה.'

fa:
  page_title: مسیر
  page_description: "مسیری جاده‌ای که چند مکان را به ترتیب به هم وصل می‌کند، محاسبه‌شده با سرور مسیریابی OSRM و ترسیم‌شده روی نقشه‌ای متن‌باز."
  page_icon: 'ph:bold/path'
  intro: 'جاده‌ای که سه مکان را به ترتیب به هم متصل می‌کند و از یک سرور OSRM خواسته می‌شود. نسخه عمومی فقط برای دموها است: یک اپلیکیشن در حال تولید به wexample_symfony_geo_ds.routing.url خود اشاره می‌کند.'

ur:
  page_title: راستہ
  page_description: "کئی مقامات کو ترتیب سے جوڑنے والا سڑک کا راستہ، OSRM روٹنگ سرور سے حساب کیا گیا اور اوپن سورس نقشے پر بنایا گیا۔"
  page_icon: 'ph:bold/path'
  intro: 'تین مقامات کو جوڑنے والی سڑک، ترتیب کے مطابق، OSRM سرور سے پوچھی گئی۔ عوامی سرور صرف ڈیمو کے لیے ہے: پروڈکشن میں ایک ایپ اپنے لیے wexample_symfony_geo_ds.routing.url کی طرف اشارہ کرتی ہے۔'

ja:
  page_title: ルート
  page_description: "複数の地点を順につなぐ道路ルート。OSRM ルーティングサーバーで算出し、オープンソースの地図に描画。"
  page_icon: 'ph:bold/path'
  intro: OSRMサーバーに依頼された、順番に3つの地点を結ぶ道路。公共のものはデモ専用で、実稼働中のアプリは自分のwexample_symfony_geo_ds.routing.urlを指しています。

ko:
  page_title: 경로
  page_description: "여러 장소를 순서대로 잇는 도로 경로를 OSRM 라우팅 서버로 계산해 오픈소스 지도에 그립니다."
  page_icon: 'ph:bold/path'
  intro: '세 장소를 순서대로 연결하는 도로로, OSRM 서버에 요청합니다. 공용 서버는 데모 용도로만 사용되며, 실제 운영 중인 앱은 자신의 wexample_symfony_geo_ds.routing.url을 가리킵니다.'

bn:
  page_title: রাস্তা
  page_description: "কয়েকটি স্থানকে ক্রমানুসারে যুক্ত করা সড়কপথ, OSRM রাউটিং সার্ভারে গণনা করা এবং ওপেন-সোর্স মানচিত্রে আঁকা।"
  page_icon: 'ph:bold/path'
  intro: 'তিনটি স্থানের মধ্যে সংযোগকারী রাস্তা, OSRM সার্ভার থেকে জিজ্ঞাসা করা হয়েছে। জনসাধারণের জন্য একটি ডেমো সার্ভার রয়েছে: একটি উৎপাদন অ্যাপ্লিকেশন নিজস্ব ঠিকানায় wexample_symfony_geo_ds.routing.url নির্দেশ করে।'

th:
  page_title: เส้นทาง
  page_description: "เส้นทางถนนที่เชื่อมหลายสถานที่ตามลำดับ คำนวณโดยเซิร์ฟเวอร์ OSRM และวาดบนแผนที่โอเพนซอร์ส"
  page_icon: 'ph:bold/path'
  intro: 'ถนนที่เชื่อมโยงสามสถานที่ตามลำดับ ซึ่งขอจากเซิร์ฟเวอร์ OSRM เซิร์ฟเวอร์สาธารณะให้บริการเฉพาะการสาธิต: แอปพลิเคชันในระบบผลิตชี้ไปที่ wexample_symfony_geo_ds.routing.url ของตนเอง.'

de:
  page_title: Route
