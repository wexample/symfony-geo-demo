en:
  page_title: Geo
  page_icon: ph:bold/map-trifold
  intro: >-
    Places stored with a postal address and the point it sits on, pinned on an
    open source map: MapLibre drawing OpenFreeMap tiles, no key and no tracking.
    A pin opens the place's name.
  geocoder:
    label: Geocoder
    available: Installed, addresses without a point can be located
    missing: None installed, points are typed in or imported
  column:
    name: Place
    address: Address
    point: Latitude, longitude
